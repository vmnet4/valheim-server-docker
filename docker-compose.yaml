services:
  valheim:
    image: ghcr.io/vmnet4/valheim-server-img/valheim-server
    cap_add:
      - sys_nice
    volumes:
      - $HOME/valheim-server-family/config:/config
      - $HOME/valheim-server-family/data:/opt/valheim
    ports:
      - "2456-2458:2456-2458/udp"
      - "9001:9001/tcp"
    env_file:
      - $HOME/valheim-server-family/valheim.env
    restart: always
    stop_grace_period: 2m
